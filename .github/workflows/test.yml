name: Tests
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q

  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: sh native/build.sh
