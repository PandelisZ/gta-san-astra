[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "san-astra"
version = "0.1.0"
description = "Frame-only visual driving controls for PCSX2"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "Pillow>=11"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
san-astra = "san_astra.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

